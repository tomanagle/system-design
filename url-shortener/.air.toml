root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd"
entrypoint = ["./tmp/main"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "6s"
poll = true
poll_interval = 500

[misc]
clean_on_exit = true
