name: url-shortener

x-app-environment: &app-environment
  LOG_LEVEL: info
  DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-redirect-events-v1}
  KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-4}
  KAFKA_CONSUMER_GROUP: redirect-analytics-v1
  ANALYTICS_QUEUE_SIZE: ${ANALYTICS_QUEUE_SIZE:-10000}
  ANALYTICS_HASH_KEY: ${ANALYTICS_HASH_KEY:-local-development-key-change-before-deploying}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_DB: analytics
  CLICKHOUSE_USER: analytics
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}

services:
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
      - --kafka.version=3.6.0
      - --refresh.metadata=10s
    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-18123}:8123"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-analytics}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user analytics --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1 FROM analytics.redirect_events LIMIT 0'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: dev/Dockerfile
      target: runtime
    command: ["worker"]
    init: true
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-4}
    environment: *app-environment
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 15s

  app:
    build:
      context: ..
      dockerfile: dev/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    environment: *app-environment
    expose:
      - "8080"
    deploy:
      replicas: ${APP_REPLICAS:-3}
    labels:
      - traefik.enable=true
      - traefik.http.routers.url-shortener.rule=PathPrefix(`/`)
      - traefik.http.routers.url-shortener.entrypoints=web
      - traefik.http.services.url-shortener.loadbalancer.server.port=8080
      - traefik.http.services.url-shortener.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.url-shortener.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.url-shortener.loadbalancer.healthcheck.timeout=2s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 15s

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`, `url-shortener`)
      - --entrypoints.web.address=:80
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --ping=true
      - --accesslog=true
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  clickhouse_data:
