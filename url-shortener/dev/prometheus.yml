global:
  scrape_interval: 5s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: url-shortener
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8080
        refresh_interval: 5s
